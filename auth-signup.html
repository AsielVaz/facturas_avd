<!DOCTYPE html>
<html lang="en">

<head>
     <!-- Title Meta -->
     <meta charset="utf-8" />
     <title>Sign Up | Velok - Responsive Admin Dashboard Template</title>
     <meta name="viewport" content="width=device-width, initial-scale=1" />
     <meta name="description" content="Admin Dashboard Template." />
     <meta name="author" content="FoxPixel" />
     <meta http-equiv="X-UA-Compatible" content="IE=edge" />
     <link rel="shortcut icon" href="assets/images/favicon.ico">

     <link href="assets/css/vendor.min.css" rel="stylesheet" type="text/css" />
     <link href="assets/css/app.min.css" rel="stylesheet" type="text/css" />
     <script src="assets/js/config.min.js"></script>
</head>

<body>

     <div class="account-pages pt-2 pt-sm-5 pb-4 pb-sm-5">
          <div class="container">
               <div class="row justify-content-center">
                    <div class="col-xl-5">
                         <div class="card auth-card">
                              <div class="card-body">
                                   <div class="p-3">
                                        <div class="mx-auto mb-5 auth-logo text-center">
                                             <a href="index.html" class="logo-dark">
                                                  <img src="assets/images/logo-dark.png" height="30" alt="logo dark">
                                             </a>

                                             <a href="index.html" class="logo-light">
                                                  <img src="assets/images/logo-white.png" height="30" alt="logo light">
                                             </a>
                                        </div>
                                        <div class="text-center">
                                             <h3 class="fw-bold text-dark fs-20">Hi , Sign Up 👋 </h3>
                                             <p class="text-muted mt-1 mb-4">New to our platform? Sign up now! It only takes a minute.</p>
                                        </div>
                                        <div class="p-3">
                                             <form action="index.html" class="authentication-form">
                                  s                <div class="mb-3">
                                                       <label class="form-label" for="example-name">Name</label>
                                                       <div class="position-relative w-100">
                                                            <input type="email" class="form-control form-control-lg rounded" id="UserEmail" placeholder="Enter User Name" required="">
                                                            <p class="text-muted p-0 position-absolute end-0 top-50 border-0 fs-4 translate-middle-y me-2 mb-0"><iconify-icon icon="solar:user-bold-duotone" class="fs-20 mt-1 text-muted"></iconify-icon></p>
                                                       </div>
                                                  </div>
                                                  <div class="mb-3">
                                                       <label class="form-label" for="example-email">Email</label>
                                                       <div class="position-relative w-100">
                                                            <input type="email" class="form-control form-control-lg rounded" id="UserEmail" placeholder="Enter Email" required="">
                                                            <p class="text-muted p-0 position-absolute end-0 top-50 border-0 fs-4 translate-middle-y me-2 mb-0"><iconify-icon icon="solar:letter-bold-duotone" class="fs-20 mt-1 text-muted"></iconify-icon></p>
                                                       </div>
                                                  </div>
                                                  <div class="mb-3">
                                                       <label class="form-label" for="example-password">Password</label>
                                                       <div class="position-relative w-100">
                                                            <input type="password" class="form-control form-control-lg rounded" id="UserPass" placeholder="Enter password" required="">
                                                            <button type="button" class="btn text-muted p-0 position-absolute end-0 top-50 border-0 fs-4 translate-middle-y me-2"><iconify-icon icon="solar:eye-bold-duotone" class="fs-20 mt-1 text-muted"></iconify-icon></button>
                                                       </div>
                                                  </div>
                                                  <div class="mb-3">
                                                       <div class="form-check">
                                                            <input type="checkbox" class="form-check-input" id="checkbox-signin">
                                                            <label class="form-check-label" for="checkbox-signin">I accept Terms and Condition</label>
                                                       </div>
                                                  </div>

                                                  <div class="mb-1 text-center d-grid">
                                                       <button class="btn btn-primary" type="submit">Sign Up</button>
                                                  </div>
                                             </form>
                                             <p class="mt-3 fw-semibold no-span">Or Sign In with</p>

                                             <div class="d-flex align-items-center justify-content-center gap-3 text-center">
                                                  <a href="javascript:void(0);" class="btn btn-outline-danger shadow px-2 d-flex align-items-center justify-content-center gap-1 fw-medium">
                                                       <iconify-icon icon="flat-color-icons:google" class="fs-20"></iconify-icon>
                                                       Google
                                                  </a>
                                                  <a href="javascript:void(0);" class="btn btn-outline-primary shadow px-2 d-flex align-items-center justify-content-center gap-1 fw-medium">
                                                       <iconify-icon icon="logos:facebook" class="fs-20"></iconify-icon>
                                                       Facebook
                                                  </a>
                                                  <a href="javascript:void(0);" class="btn btn-outline-dark shadow px-2 d-flex align-items-center justify-content-center gap-1 fw-medium">
                                                       <iconify-icon icon="mdi:github" class="fs-20"></iconify-icon>
                                                       Github
                                                  </a>
                                             </div>
                                        </div>

                                        <p class="text-muted text-center mt-4 mb-0">I already have an account <a href="auth-signin.html" class="link-primary fst-italic text-decoration-underline fw-semibold">Sign In</a></p>
                                   </div> <!-- end col -->
                              </div> <!-- end card-body -->
                         </div> <!-- end card -->
                    </div> <!-- end col -->
               </div> <!-- end row -->
          </div>
     </div>

     <script src="assets/js/vendor.js"></script>
     <script src="assets/js/app.js"></script>


</body>

</html>
